<!DOCTYPE html>
<html lang="UTF-8">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoAS 법정서식 업무시스템</title>

    <!-- CSS SET -->
    <!-- 기존 프로젝트 CSS -->
    <link rel="stylesheet" type="text/css" href="resources/css/old/common.css" />
    <link rel="stylesheet" type="text/css" href="resources/css/old/admin.css" />
    <link rel="stylesheet" type="text/css" href="resources/css/old/animate.css" />
    <link rel="stylesheet" type="text/css" href="resources/css/old/bootstrap.min.css" />
    <link rel="stylesheet" type="text/css" href="resources/css/old/filestyle.css" />
    <link rel="stylesheet" type="text/css" href="resources/css/old/font-awesome.min.css" />
    <link rel="stylesheet" type="text/css" href="resources/css/old/jqgrid.css" />
    <link rel="stylesheet" type="text/css" href="resources/css/old/jquery-ui-1.10.3.custom.css" />
    <link rel="stylesheet" type="text/css" href="resources/css/old/layer.pop.css" />
    <link rel="stylesheet" type="text/css" href="resources/css/old/select2.css" />
    <link rel="stylesheet" type="text/css" href="resources/css/old/smartadmin-production-plugins.min.css" />
    <link rel="stylesheet" type="text/css" href="resources/css/old/smartadmin-production.min.css" />
    <link rel="stylesheet" type="text/css" href="resources/css/old/smartadmin-rtl.min.css" />
    <link rel="stylesheet" type="text/css" href="resources/css/old/smartadmin-skins.min.css" />
    <link rel="stylesheet" type="text/css" href="resources/css/old/style.css" />
    <link rel="stylesheet" type="text/css" href="resources/css/old/style1.css" />
    <link rel="stylesheet" type="text/css" href="resources/css/old/style_eco.css" />
    <link rel="stylesheet" type="text/css" href="resources/css/old/style_renewal.css" />
    <link rel="stylesheet" type="text/css" href="resources/css/old/swiper.css" />
    <link rel="stylesheet" type="text/css" href="resources/css/old/toggle.css" />

    <!-- 신규 추가 CSS 해당 부분만 신규 반영 -->
    <link rel="stylesheet" type="text/css" href="resources/css/font.css" />
    <link rel="stylesheet" type="text/css" href="resources/css/swiper-bundle.min.css" />
    <link rel="stylesheet" type="text/css" href="resources/css/ecoas_contents.css" />

    <!-- SCRIPT SET -->
    <script src="resources/js/jquery-3.7.1.js"></script>
    <script src="resources/js/swiper-bundle.min.js"></script>
    <script src="resources/js/ecoas_common.js"></script>

</head>
<body>
    <div class="new-container">
        <div class="login-form">
            <div class="login-header">
                <i class="logo-box">
                    <img src="resources/images/common/logo.png"/>
                </i>
                <div class="title">법정서식 업무시스템</div>
            </div>

            <div class="login-comment">
                EcoAS 법정서식 업무를 위한 전용 로그인 화면입니다.
            </div>

            <div class="login-confirm">
                <div class="confirm-name">
                    <input class="input-cont" type="text" placeholder="이름" />
                </div>
                <div class="confirm-box">
                    <div class="confirm-con">
                        <input class="input-cont" type="text" placeholder="전화번호" />
                        <!-- 25.11.06 클릭 이벤트 추가 -->
                        <button class="btn-new btn-focus-line" onclick="phoneConfirm();" type="button">
                            <span>전송</span>
                        </button>
                    </div>
                    <div class="confirm-con">
                        <!-- 25.11.06 인증 카운트 추가 DOM 구조 변경 -->
                        <div class="input-box">
                            <input class="input-cont" type="text" placeholder="인증번호" />
                            <div class="input-count">
                                <i>
                                    <img src="resources/images/common/time_ico.png"/>
                                </i>
                                <span class="count">10:00</span>
                            </div>
                        </div>
                        <!-- 25.11.06 클릭 이벤트 추가 -->
                        <button class="btn-new btn-focus-line" onclick="confirmCheck();" type="button">
                            <span>인증</span>
                        </button>
                    </div>
                </div>
            </div>

            <div class="login-box">
                <div class="login-inpt">
                    <input class="input-cont" type="text" placeholder="아이디" />
                    <input class="input-cont" type="password" placeholder="비밀번호" />
                </div>
                <div class="login-btn">
                    <a href="javascript:;" class="btn-new btn-focus" >
                        <span>로그인</span>
                    </a>
                </div>
            </div>

            
        </div>
    </div>

    <script>
            
        /* 25.11.06 로그인 인증 카운트 추가 */
        function phoneConfirm(){
            $(".input-count").addClass('active');

            var confirmTime = 10 * 60;
            var $countCont = $(".input-count .count");

            // 이전 타이머 삭제
            clearInterval(window.countTimer);

            window.countTimer = setInterval(function(){
                var min = Math.floor(confirmTime / 60);
                var sec = confirmTime % 60;

                var formatted = 
                    (min < 10 ? "0" + min : min) + ":" + 
                    (sec < 10 ? "0" + sec : sec);

                $countCont.text(formatted);

                if (confirmTime <= 0) {
                    // 타이머 0초 조건 추가
                    clearInterval(window.countTimer);
                    $countCont.text("00:00");
                    alert("인증 시간이 만료 되었습니다.");
                }

                confirmTime--;
            }, 1000);

        }

        /* 25.11.06 핸드폰 인증 버튼 이벤트 추가 */
        function confirmCheck(){
            // 카운트 stop
            clearInterval(window.countTimer);

            // 카운트 숨기기
            $(".input-count").removeClass('active');
            $(".input-count .count").text("00:00");

            alert("인증이 완료 되었습니다.");
        }

    </script>
</body>
</html>
